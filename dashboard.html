      (function ensureBaseHref() {
        try {
          const current = new URL(document.currentScript?.src || window.location.href, window.location.href);
          const base = new URL('./', current);
          let baseEl = document.querySelector('base[data-auto-base]');
          if (!baseEl) {
            baseEl = document.createElement('base');
            baseEl.setAttribute('data-auto-base', 'true');
            if (document.head.firstChild) {
              document.head.insertBefore(baseEl, document.head.firstChild);
            } else {
              document.head.appendChild(baseEl);
            }
          }
          baseEl.href = base.href;
          window.__APP_BASE_URL__ = base.href;
        } catch (error) {
          console.error('Nao foi possivel definir a base dos assets.', error);
        }
      })();
    </script>

    <script type="module">
import htm from 'https://esm.sh/htm@3.1.1';

const { createElement: h, useState, useEffect, useMemo, useRef, useCallback } = React;
const { createRoot } = ReactDOM;
const html = htm.bind(h);

const COLORS = ['#1d4ed8','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#65a30d','#ea580c'];
const CLASS_COLORS = { 'IDR-Parana': '#1d4ed8', 'Sanepar': '#059669' };

const TABS = [
  { id:'capa', label:'Capa' },
  { id:'visao-geral', label:'Visao Geral' },
  { id:'bacias', label:'Bacias' },
  { id:'regionais', label:'Regionais' },
  { id:'municipios', label:'Municipios' },
  { id:'classificacao', label:'Classificacao' },
  { id:'urts', label:'URTs' },
  { id:'tabela-detalhada', label:'Tabela Detalhada' }
];

// ============ DATA LOADER ============
async function loadData() {
  const [bacias, ursBuffer] = await Promise.all([
    fetch('data/baciasselecionadas.geojson').then(r => r.json()),
    fetch('data/urs__urs.geojson_part-001.gz').then(r => r.arrayBuffer())
  ]);
  const ursText = window.pako.ungzip(new Uint8Array(ursBuffer), { to: 'string' });
  const urts = JSON.parse(ursText);
  return { bacias, urts };
}

// ============ D3 CHART COMPONENTS ============
function D3HBar({ data, fill, height }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const margin = { top: 8, right: 40, bottom: 20, left: 140 };
    const w = (el.clientWidth || 460);
    const barH = 22;
    const totalH = height || Math.max(120, data.length * (barH + 4) + margin.top + margin.bottom);
    const innerW = w - margin.left - margin.right;
    const innerH = totalH - margin.top - margin.bottom;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', totalH);
    const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    const x = d3.scaleLinear().domain([0, d3.max(data, d => d.value) || 1]).range([0, innerW]);
    const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, innerH]).padding(0.15);

    g.selectAll('rect').data(data).join('rect')
      .attr('y', d => y(d.name)).attr('width', d => x(d.value))
      .attr('height', y.bandwidth()).attr('fill', fill || '#1d4ed8').attr('rx', 3);

    g.selectAll('.label').data(data).join('text').attr('class', 'label')
      .attr('x', d => x(d.value) + 4).attr('y', d => y(d.name) + y.bandwidth() / 2)
      .attr('dy', '0.35em').text(d => d.value)
      .attr('font-size', '11px').attr('fill', '#374151');

    g.append('g').call(d3.axisLeft(y).tickSize(0)).select('.domain').remove();
    g.selectAll('.tick text').attr('font-size', '11px');
    g.append('g').attr('transform', 'translate(0,' + innerH + ')').call(d3.axisBottom(x).ticks(5))
      .selectAll('text').attr('font-size', '10px');
  }, [data, fill, height]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '120px' }}></div>`;
}

function D3Donut({ data }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const w = Math.min(el.clientWidth || 300, 320);
    const h = 260;
    const radius = Math.min(w, h) / 2 - 10;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', h);
    const g = svg.append('g').attr('transform', 'translate(' + (w / 2) + ',' + (h / 2) + ')');

    const pie = d3.pie().value(d => d.value).sort(null);
    const arc = d3.arc().innerRadius(radius * 0.55).outerRadius(radius);
    const labelArc = d3.arc().innerRadius(radius * 0.8).outerRadius(radius * 0.8);

    const arcs = g.selectAll('path').data(pie(data)).join('path')
      .attr('d', arc).attr('fill', (d, i) => d.data.color || COLORS[i % COLORS.length])
      .attr('stroke', '#fff').attr('stroke-width', 2);

    g.selectAll('.lbl').data(pie(data)).join('text').attr('class', 'lbl')
      .attr('transform', d => 'translate(' + labelArc.centroid(d) + ')')
      .attr('text-anchor', 'middle').attr('font-size', '11px').attr('fill', '#fff').attr('font-weight', '600')
      .text(d => d.data.value);

    // Legend below
    const lg = svg.append('g').attr('transform', 'translate(10,' + (h - 30) + ')');
    let lx = 0;
    data.forEach((d, i) => {
      const grp = lg.append('g').attr('transform', 'translate(' + lx + ',0)');
      grp.append('rect').attr('width', 12).attr('height', 12).attr('rx', 2)
        .attr('fill', d.color || COLORS[i % COLORS.length]);
      grp.append('text').attr('x', 16).attr('y', 10).text(d.name + ' (' + d.value + ')')
        .attr('font-size', '11px').attr('fill', '#374151');
      lx += d.name.length * 7 + 60;
    });
  }, [data]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '260px' }}></div>`;
}

function D3StackedBar({ data, keys, colors }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const margin = { top: 8, right: 40, bottom: 20, left: 140 };
    const w = el.clientWidth || 460;
    const barH = 24;
    const totalH = data.length * (barH + 4) + margin.top + margin.bottom;
    const innerW = w - margin.left - margin.right;
    const innerH = totalH - margin.top - margin.bottom;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', totalH);
    const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    const maxVal = d3.max(data, d => keys.reduce((s, k) => s + (d[k] || 0), 0)) || 1;
    const x = d3.scaleLinear().domain([0, maxVal]).range([0, innerW]);
    const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, innerH]).padding(0.15);
    const color = d3.scaleOrdinal().domain(keys).range(keys.map(k => colors[k] || '#94a3b8'));

    const stack = d3.stack().keys(keys)(data);
    g.selectAll('g.layer').data(stack).join('g').attr('class', 'layer')
      .attr('fill', d => color(d.key))
      .selectAll('rect').data(d => d).join('rect')
      .attr('y', d => y(d.data.name)).attr('x', d => x(d[0]))
      .attr('width', d => x(d[1]) - x(d[0])).attr('height', y.bandwidth()).attr('rx', 2);

    g.append('g').call(d3.axisLeft(y).tickSize(0)).select('.domain').remove();
    g.selectAll('.tick text').attr('font-size', '11px');

    // Legend
    const lg = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + (totalH - 2) + ')');
    keys.forEach((k, i) => {
      const grp = lg.append('g').attr('transform', 'translate(' + (i * 120) + ',0)');
      grp.append('rect').attr('width', 12).attr('height', 12).attr('rx', 2).attr('fill', color(k));
      grp.append('text').attr('x', 16).attr('y', 10).text(k).attr('font-size', '11px').attr('fill', '#374151');
    });
  }, [data, keys, colors]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '120px' }}></div>`;
}

function MiniMap({ features, points, colorFn }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !features || features.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const w = el.clientWidth || 500;
    const hh = 320;
    const svg = d3.select(el).append('svg').attr('width', w).attr('height', hh);
    const geo = { type: 'FeatureCollection', features };
    const proj = d3.geoMercator().fitSize([w - 20, hh - 20], geo);
    const path = d3.geoPath().projection(proj);
    svg.selectAll('path').data(features).join('path')
      .attr('d', path)
      .attr('fill', d => colorFn ? colorFn(d) : '#93c5fd')
      .attr('stroke', '#1e40af').attr('stroke-width', 0.5).attr('opacity', 0.7);
    if (points && points.length > 0) {
      svg.selectAll('circle').data(points).join('circle')
        .attr('cx', d => { const p = proj(d.geometry.coordinates); return p ? p[0] : 0; })
        .attr('cy', d => { const p = proj(d.geometry.coordinates); return p ? p[1] : 0; })
        .attr('r', 4).attr('fill', '#dc2626').attr('stroke', '#fff').attr('stroke-width', 1);
    }
  }, [features, points, colorFn]);
  return html`<div ref=${ref} class="dashboard-minimap" style=${{ minHeight: '320px' }}></div>`;
}

function D3Treemap({ data }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const w = el.clientWidth || 500;
    const hh = 320;
    const root = d3.hierarchy({ children: data }).sum(d => d.value || 0);
    d3.treemap().size([w, hh]).padding(2)(root);
    const svg = d3.select(el).append('svg').attr('width', w).attr('height', hh);
    const color = d3.scaleOrdinal(d3.schemeTableau10);
    const nodes = svg.selectAll('g').data(root.leaves()).join('g')
      .attr('transform', d => 'translate(' + d.x0 + ',' + d.y0 + ')');
    nodes.append('rect')
      .attr('width', d => Math.max(0, d.x1 - d.x0))
      .attr('height', d => Math.max(0, d.y1 - d.y0))
      .attr('fill', d => color(d.data.group || d.data.name))
      .attr('rx', 3).attr('opacity', 0.85);
    nodes.append('text').attr('x', 4).attr('y', 14)
      .text(d => (d.x1 - d.x0 > 50 && d.y1 - d.y0 > 18) ? d.data.name : '')
      .attr('font-size', '10px').attr('fill', '#fff');
    nodes.append('text').attr('x', 4).attr('y', 26)
      .text(d => (d.x1 - d.x0 > 40 && d.y1 - d.y0 > 30) ? d.data.value : '')
      .attr('font-size', '9px').attr('fill', 'rgba(255,255,255,0.8)');
  }, [data]);
  return html`<div ref=${ref} class="dashboard-minimap" style=${{ minHeight: '320px' }}></div>`;
}

// ============ REUSABLE COMPONENTS ============
function KPICard({ number, label }) {
  return html`<div class="ds-indicator-card">
    <span class="ds-indicator-number">${number}</span>
    <span class="ds-indicator-label">${label}</span>
  </div>`;
}

function SortableTable({ columns, data, pageSize }) {
  const ps = pageSize || 15;
  const [search, setSearch] = useState('');
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [page, setPage] = useState(0);

  const filtered = useMemo(() => {
    if (!search) return data;
    const q = search.toLowerCase();
    return data.filter(row => columns.some(c => String(row[c.key] || '').toLowerCase().includes(q)));
  }, [data, search, columns]);

  const sorted = useMemo(() => {
    if (!sortCol) return filtered;
    return [...filtered].sort((a, b) => {
      const va = a[sortCol] ?? '';
      const vb = b[sortCol] ?? '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), 'pt') * sortDir;
    });
  }, [filtered, sortCol, sortDir]);

  const totalPages = Math.ceil(sorted.length / ps);
  const paged = sorted.slice(page * ps, (page + 1) * ps);
  useEffect(() => { setPage(0); }, [search, data]);

  const handleSort = (key) => {
    if (sortCol === key) setSortDir(d => d * -1);
    else { setSortCol(key); setSortDir(1); }
  };

  return html`
    <input class="dashboard-search" placeholder="Buscar..." value=${search}
      onInput=${e => setSearch(e.target.value)} />
    <div style=${{ overflowX: 'auto' }}>
      <table class="dashboard-table">
        <thead><tr>
          ${columns.map(c => html`<th key=${c.key} onClick=${() => handleSort(c.key)}>
            ${c.label} ${sortCol === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}
          </th>`)}
        </tr></thead>
        <tbody>
          ${paged.map((row, i) => html`<tr key=${i}>
            ${columns.map(c => html`<td key=${c.key}>${row[c.key] ?? '--'}</td>`)}
          </tr>`)}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 && html`<div class="dashboard-pagination">
      <button disabled=${page === 0} onClick=${() => setPage(p => p - 1)}>Anterior</button>
      <span>${page + 1} de ${totalPages} (${sorted.length} registros)</span>
      <button disabled=${page >= totalPages - 1} onClick=${() => setPage(p => p + 1)}>Proximo</button>
    </div>`}`;
}

    <p><strong>Painel de Indicadores — Business Intelligence</strong></p>

    <p style=${{ marginTop: '1rem', fontSize: '0.92rem', color: '#64748b' }}>

function PageVisaoGeral({ baciasData, urtsData }) {
  const mananciais = new Set(baciasData.map(f => f.properties.Manancial)).size;
  const ottos = baciasData.length;
  const bacias = new Set(baciasData.map(f => f.properties.Nome_bacia)).size;
  const municipios = new Set(baciasData.map(f => f.properties.NomeMunicipio)).size;
  const regionais = new Set(baciasData.map(f => f.properties['Regional IDR'])).size;
  const urts = urtsData.length;
  const classeData = useMemo(() => {
    const counts = {};
    baciasData.forEach(f => { const c = f.properties.Classe; counts[c] = (counts[c] || 0) + 1; });
    return Object.entries(counts).map(([name, value]) => ({ name, value, color: CLASS_COLORS[name] || '#94a3b8' }));
  }, [baciasData]);
  const colorFn = useCallback(d => CLASS_COLORS[d.properties.Classe] || '#94a3b8', []);
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${mananciais} label="Mananciais" />
      <${KPICard} number=${ottos} label="Ottobacias" />
      <${KPICard} number=${bacias} label="Bacias" />
      <${KPICard} number=${municipios} label="Municipios" />
      <${KPICard} number=${regionais} label="Regionais" />
      <${KPICard} number=${urts} label="URTs" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Mapa das Ottobacias por Classe</h3>
        <${MiniMap} features=${baciasData} colorFn=${colorFn} />
      </div>
      <div class="dashboard-card">
        <h3>Distribuicao por Classe</h3>
        <${D3Donut} data=${classeData} />
      </div>
    </div>`;
}

function PageBacias({ baciasData }) {
  const bacias = new Set(baciasData.map(f => f.properties.Nome_bacia)).size;
  const ottos = baciasData.length;
  const ottosPorBacia = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const b = f.properties.Nome_bacia; m[b] = (m[b] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  const manPorBacia = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const b = f.properties.Nome_bacia; if (!m[b]) m[b] = new Set(); m[b].add(f.properties.Manancial); });
    return Object.entries(m).map(([name, s]) => ({ name, value: s.size })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  const munPorBacia = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const b = f.properties.Nome_bacia; if (!m[b]) m[b] = new Set(); m[b].add(f.properties.NomeMunicipio); });
    return Object.entries(m).map(([name, s]) => ({ name, value: s.size })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${bacias} label="Total Bacias" />
      <${KPICard} number=${ottos} label="Total Ottobacias" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Ottobacias por Bacia</h3><${D3HBar} data=${ottosPorBacia} /></div>
      <div class="dashboard-card"><h3>Mananciais por Bacia</h3><${D3HBar} data=${manPorBacia} fill="#059669" /></div>
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Municipios por Bacia</h3><${D3HBar} data=${munPorBacia} fill="#d97706" /></div>
    </div>`;
}

function PageRegionais({ baciasData }) {
  const regionais = new Set(baciasData.map(f => f.properties['Regional IDR'])).size;
  const ottosPorReg = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const r = f.properties['Regional IDR']; m[r] = (m[r] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  const manPorReg = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const r = f.properties['Regional IDR']; if (!m[r]) m[r] = new Set(); m[r].add(f.properties.Manancial); });
    return Object.entries(m).map(([name, s]) => ({ name, value: s.size })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  const media = regionais > 0 ? (baciasData.length / regionais).toFixed(1) : 0;
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${regionais} label="Total Regionais" />
      <${KPICard} number=${media} label="Media ottobacias/regional" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Ottobacias por Regional</h3><${D3HBar} data=${ottosPorReg} /></div>
      <div class="dashboard-card"><h3>Mananciais por Regional</h3><${D3HBar} data=${manPorReg} fill="#059669" /></div>
    </div>`;
}

function PageMunicipios({ baciasData }) {
  const municipios = new Set(baciasData.map(f => f.properties.NomeMunicipio)).size;
  const ottosPorMun = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const mu = f.properties.NomeMunicipio; m[mu] = (m[mu] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [baciasData]);
  const topMun = ottosPorMun[0] ? ottosPorMun[0].name + ' (' + ottosPorMun[0].value + ')' : '--';
  const treemapData = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const mu = f.properties.NomeMunicipio; const ba = f.properties.Nome_bacia; m[mu] = m[mu] || { name: mu, value: 0, group: ba }; m[mu].value++; });
    return Object.values(m);
  }, [baciasData]);
  const top10 = ottosPorMun.slice(0, 10);
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${municipios} label="Total Municipios" />
      <${KPICard} number=${topMun} label="Mais ottobacias" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Municipios por Bacia (Treemap)</h3><${D3Treemap} data=${treemapData} /></div>
      <div class="dashboard-card">
        <h3>Top 10 Municipios</h3>
        <table class="dashboard-table">
          <thead><tr><th>Municipio</th><th>Ottobacias</th></tr></thead>
          <tbody>${top10.map((r, i) => html`<tr key=${i}><td>${r.name}</td><td>${r.value}</td></tr>`)}</tbody>
        </table>
      </div>
    </div>`;
}

function PageClassificacao({ baciasData }) {
  const classeGeral = useMemo(() => {
    const counts = {}; baciasData.forEach(f => { const c = f.properties.Classe; counts[c] = (counts[c] || 0) + 1; });
    return Object.entries(counts).map(([name, value]) => ({ name, value, color: CLASS_COLORS[name] || '#94a3b8' }));
  }, [baciasData]);
  const classePorBacia = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const b = f.properties.Nome_bacia; const c = f.properties.Classe; if (!m[b]) m[b] = { name: b }; m[b][c] = (m[b][c] || 0) + 1; });
    return Object.values(m).sort((a, b) => (b['Sanepar'] || 0) - (a['Sanepar'] || 0));
  }, [baciasData]);
  const classePorRegional = useMemo(() => {
    const m = {}; baciasData.forEach(f => { const r = f.properties['Regional IDR']; const c = f.properties.Classe; if (!m[r]) m[r] = { regional: r, 'IDR-Parana': 0, 'Sanepar': 0 }; m[r][c] = (m[r][c] || 0) + 1; });
    return Object.values(m).sort((a, b) => a.regional.localeCompare(b.regional, 'pt'));
  }, [baciasData]);
  const classKeys = [...new Set(baciasData.map(f => f.properties.Classe))];
  return html`
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Proporcao Geral</h3><${D3Donut} data=${classeGeral} /></div>
      <div class="dashboard-card"><h3>Classe por Bacia</h3>
        <${D3StackedBar} data=${classePorBacia} keys=${classKeys} colors=${CLASS_COLORS} />
      </div>
    </div>
    <div class="dashboard-card" style=${{ marginBottom: '1.5rem' }}>
      <h3>Contagem por Classe e Regional</h3>
      <table class="dashboard-table">
        <thead><tr><th>Regional</th><th>IDR-Parana</th><th>Sanepar</th><th>Total</th></tr></thead>
        <tbody>${classePorRegional.map((r, i) => html`<tr key=${i}>
          <td>${r.regional}</td><td>${r['IDR-Parana'] || 0}</td><td>${r['Sanepar'] || 0}</td>
          <td>${(r['IDR-Parana'] || 0) + (r['Sanepar'] || 0)}</td>
        </tr>`)}</tbody>
      </table>
    </div>`;
}

function PageURTs({ baciasData, urtsData }) {
  const total = urtsData.length;
  const mip = urtsData.filter(f => f.properties.MIP === 'Sim').length;
  const mid = urtsData.filter(f => f.properties.MID === 'Sim').length;
  const col = urtsData.filter(f => f.properties.Coletor === 'Sim').length;
  const porPrograma = useMemo(() => {
    const m = {}; urtsData.forEach(f => { const p = f.properties.Programa || 'Sem programa'; m[p] = (m[p] || 0) + 1; });
    return Object.entries(m).map(([name, value], i) => ({ name, value, color: COLORS[i % COLORS.length] }));
  }, [urtsData]);
  const porRegional = useMemo(() => {
    const m = {}; urtsData.forEach(f => { const r = f.properties['Regional IDR'] || f.properties['Região'] || '--'; m[r] = (m[r] || 0) + 1; });
    return Object.entries(m).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [urtsData]);
  const tableData = useMemo(() =>
    urtsData.map(f => ({ Agricultor: f.properties.Agricultor || '--', Municipio: f.properties.NomeMunicipio || f.properties.Municipio || '--', Programa: f.properties.Programa || '--', MIP: f.properties.MIP || '--', MID: f.properties.MID || '--', Coletor: f.properties.Coletor || '--' }))
  , [urtsData]);
  const tableCols = [
    { key: 'Agricultor', label: 'Agricultor' }, { key: 'Municipio', label: 'Municipio' },
    { key: 'Programa', label: 'Programa' }, { key: 'MIP', label: 'MIP' },
    { key: 'MID', label: 'MID' }, { key: 'Coletor', label: 'Coletor' }
  ];
  const colorFn = useCallback(d => CLASS_COLORS[d.properties.Classe] || '#93c5fd', []);
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${total} label="Total URTs" />
      <${KPICard} number=${mip} label="Com MIP" />
      <${KPICard} number=${mid} label="Com MID" />
      <${KPICard} number=${col} label="Com Coletor" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>URTs por Programa</h3><${D3Donut} data=${porPrograma} /></div>
      <div class="dashboard-card"><h3>URTs por Regional</h3><${D3HBar} data=${porRegional} fill="#7c3aed" /></div>
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card"><h3>Mapa: URTs sobre Ottobacias</h3>
        <${MiniMap} features=${baciasData} points=${urtsData} colorFn=${colorFn} />
      </div>
    </div>
    <div class="dashboard-card" style=${{ marginBottom: '1.5rem' }}>
      <h3>Tabela de URTs</h3>
      <${SortableTable} columns=${tableCols} data=${tableData} pageSize=${15} />
    </div>`;
}

function PageTabelaDetalhada({ baciasData }) {
  const tableData = useMemo(() =>
    baciasData.map(f => ({ Cod_otto: f.properties.Cod_otto, Manancial: f.properties.Manancial, Nome_bacia: f.properties.Nome_bacia, 'Regional IDR': f.properties['Regional IDR'], NomeMunicipio: f.properties.NomeMunicipio, Classe: f.properties.Classe }))
  , [baciasData]);
  const columns = [
    { key: 'Cod_otto', label: 'Cod. Otto' }, { key: 'Manancial', label: 'Manancial' },
    { key: 'Nome_bacia', label: 'Bacia' }, { key: 'Regional IDR', label: 'Regional IDR' },
    { key: 'NomeMunicipio', label: 'Municipio' }, { key: 'Classe', label: 'Classe' }
  ];
  return html`<div class="dashboard-card">
    <h3>Tabela Detalhada — Ottobacias</h3>
    <${SortableTable} columns=${columns} data=${tableData} pageSize=${15} />
  </div>`;
}

// ============ FILTER BAR ============
function FilterBar({ baciasData, filters, setFilters }) {
  const allRegionais = useMemo(() =>
    [...new Set(baciasData.map(f => f.properties['Regional IDR']))].sort((a, b) => a.localeCompare(b, 'pt'))
  , [baciasData]);
  const allMunicipios = useMemo(() => {
    const feats = filters.regional ? baciasData.filter(f => f.properties['Regional IDR'] === filters.regional) : baciasData;
    return [...new Set(feats.map(f => f.properties.NomeMunicipio))].sort((a, b) => a.localeCompare(b, 'pt'));
  }, [baciasData, filters.regional]);
  const allBacias = useMemo(() =>
    [...new Set(baciasData.map(f => f.properties.Nome_bacia))].sort((a, b) => a.localeCompare(b, 'pt'))
  , [baciasData]);
  const chips = [];
  if (filters.regional) chips.push({ label: 'Regional: ' + filters.regional, clear: () => setFilters(p => ({ ...p, regional: '', municipio: '' })) });
  if (filters.municipio) chips.push({ label: 'Municipio: ' + filters.municipio, clear: () => setFilters(p => ({ ...p, municipio: '' })) });
  if (filters.bacia) chips.push({ label: 'Bacia: ' + filters.bacia, clear: () => setFilters(p => ({ ...p, bacia: '' })) });
  return html`
    <div class="dashboard-filters">
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Regional IDR</label>
        <select class="dashboard-filter-select" value=${filters.regional}
          onChange=${e => setFilters(p => ({ ...p, regional: e.target.value, municipio: '' }))}>
          <option value="">Todas</option>
          ${allRegionais.map(r => html`<option key=${r} value=${r}>${r}</option>`)}
        </select>
      </div>
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Municipio</label>
        <select class="dashboard-filter-select" value=${filters.municipio}
          onChange=${e => setFilters(p => ({ ...p, municipio: e.target.value }))}>
          <option value="">Todos</option>
          ${allMunicipios.map(m => html`<option key=${m} value=${m}>${m}</option>`)}
        </select>
      </div>
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Bacia</label>
        <select class="dashboard-filter-select" value=${filters.bacia}
          onChange=${e => setFilters(p => ({ ...p, bacia: e.target.value }))}>
          <option value="">Todas</option>
          ${allBacias.map(b => html`<option key=${b} value=${b}>${b}</option>`)}
        </select>
      </div>
    </div>
    ${chips.length > 0 && html`<div class="dashboard-active-filters">
      ${chips.map((c, i) => html`<span key=${i} class="dashboard-filter-chip">
        ${c.label} <button onClick=${c.clear}>x</button>
      </span>`)}
    </div>`}`;
}

// ============ MAIN DASHBOARD ============
function Dashboard({ rawBacias, rawUrts }) {
  const [activeTab, setActiveTab] = useState(() => {
    const hh = window.location.hash.replace('#', '');
    return TABS.find(t => t.id === hh) ? hh : 'capa';
  });
  const [filters, setFilters] = useState({ regional: '', municipio: '', bacia: '' });
  const [printing, setPrinting] = useState(false);

  useEffect(() => {
    const handler = () => {
      const hh = window.location.hash.replace('#', '');
      if (TABS.find(t => t.id === hh)) setActiveTab(hh);
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const switchTab = (id) => { setActiveTab(id); window.location.hash = id; };

  const baciasFiltered = useMemo(() => {
    let feats = rawBacias.features;
    if (filters.regional) feats = feats.filter(f => f.properties['Regional IDR'] === filters.regional);
    if (filters.municipio) feats = feats.filter(f => f.properties.NomeMunicipio === filters.municipio);
    if (filters.bacia) feats = feats.filter(f => f.properties.Nome_bacia === filters.bacia);
    return feats;
  }, [rawBacias, filters]);

  const urtsFiltered = useMemo(() => {
    let feats = rawUrts.features;
    if (filters.regional) feats = feats.filter(f => (f.properties['Regional IDR'] || f.properties['Região']) === filters.regional);
    if (filters.municipio) feats = feats.filter(f => (f.properties.NomeMunicipio || f.properties.Municipio) === filters.municipio);
    if (filters.bacia) feats = feats.filter(f => f.properties.Nome_bacia === filters.bacia);
    return feats;
  }, [rawUrts, filters]);

  const handlePrintAll = () => { setPrinting(true); setTimeout(() => { window.print(); setPrinting(false); }, 300); };

  return html`<div class="dashboard-container">
    <div class="dashboard-tabs">
      ${TABS.map(t => html`<button key=${t.id}
        class=${'dashboard-tab' + (activeTab === t.id ? ' active' : '')}
        onClick=${() => switchTab(t.id)}>${t.label}</button>`)}
    </div>
    ${activeTab !== 'capa' && html`<${FilterBar} baciasData=${rawBacias.features} filters=${filters} setFilters=${setFilters} />`}
    <div class="dashboard-print-controls">
      <button onClick=${() => window.print()}>Imprimir pagina atual</button>
      <button onClick=${handlePrintAll}>Imprimir todas</button>
    </div>
    ${TABS.map(t => {
      const isActive = printing || activeTab === t.id;
      const cls = 'dashboard-page' + (isActive ? ' active' : '') + (printing ? ' print-visible' : '');
      let content;
      switch(t.id) {
        case 'capa': content = html`<${PageCapa} />`; break;
        case 'visao-geral': content = html`<${PageVisaoGeral} baciasData=${baciasFiltered} urtsData=${urtsFiltered} />`; break;
        case 'bacias': content = html`<${PageBacias} baciasData=${baciasFiltered} />`; break;
        case 'regionais': content = html`<${PageRegionais} baciasData=${baciasFiltered} />`; break;
        case 'municipios': content = html`<${PageMunicipios} baciasData=${baciasFiltered} />`; break;
        case 'classificacao': content = html`<${PageClassificacao} baciasData=${baciasFiltered} />`; break;
        case 'urts': content = html`<${PageURTs} baciasData=${baciasFiltered} urtsData=${urtsFiltered} />`; break;
        case 'tabela-detalhada': content = html`<${PageTabelaDetalhada} baciasData=${baciasFiltered} />`; break;
      }
      return html`<div key=${t.id} class=${cls}>
        <div class="print-header">
          <div class="header-logos">
            <img src="data/aguaseguralogo2.png" alt="Agua Segura" style=${{ height: '28px' }} />
            <img src="data/logo_sanepar.jpg" alt="Sanepar" style=${{ height: '24px' }} />
          </div>
          <span><strong>${t.label}</strong> — Programa Agua Segura — ${new Date().toLocaleDateString('pt-BR')}</span>
        </div>
        ${content}
        <div class="print-footer">Departamento de Sustentabilidade · IDR-Parana · 2026</div>
      </div>`;
    })}
  </div>`;
}

// ============ APP ============
function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { loadData().then(setData).catch(e => setError(e.message)); }, []);
  if (error) return html`<div class="dashboard-container"><div class="dashboard-card"><h3>Erro ao carregar dados</h3><p>${error}</p></div></div>`;
  if (!data) return html`<div class="dashboard-container" style=${{ textAlign: 'center', padding: '4rem 2rem' }}>
    <p style=${{ fontSize: '1.1rem', color: '#6b7280' }}>Carregando dados do Programa Agua Segura...</p>
  </div>`;
  return html`<${Dashboard} rawBacias=${data.bacias} rawUrts=${data.urts} />`;
}

createRoot(document.getElementById('dashboard-root')).render(html`<${App} />`);
    </script>
  </body>
</html>
