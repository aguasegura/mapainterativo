      (function ensureBaseHref() {
        try {
          const current = new URL(document.currentScript?.src || window.location.href, window.location.href);
          const base = new URL('./', current);
          let baseEl = document.querySelector('base[data-auto-base]');
          if (!baseEl) {
            baseEl = document.createElement('base');
            baseEl.setAttribute('data-auto-base', 'true');
            if (document.head.firstChild) {
              document.head.insertBefore(baseEl, document.head.firstChild);
            } else {
              document.head.appendChild(baseEl);
            }
          }
          baseEl.href = base.href;
          window.__APP_BASE_URL__ = base.href;
        } catch (error) {
          console.error('Nao foi possivel definir a base dos assets.', error);
        }
      })();
    </script>

    <script type="module">
import htm from 'https://esm.sh/htm@3.1.1';

const { createElement: h, useState, useEffect, useMemo, useRef, useCallback } = React;
const { createRoot } = ReactDOM;
const html = htm.bind(h);

const COLORS = ['#1d4ed8','#059669','#d97706','#dc2626','#7c3aed','#0891b2','#be185d','#65a30d','#ea580c',
  '#1f77b4','#ff7f0e','#2ca02c','#9467bd','#8c564b','#e377c2','#bcbd22','#17becf'];
const CLASS_COLORS = { 'IDR-Paraná': '#1d4ed8', 'IDR-Parana': '#1d4ed8', 'Sanepar': '#059669' };

const TABS = [
  { id:'capa', label:'Capa' },
  { id:'visao-geral', label:'Visao Geral' },
  { id:'relevo', label:'Relevo' },
  { id:'uso-solo', label:'Uso do Solo' },
  { id:'solos', label:'Solos' },
  { id:'recursos-hidricos', label:'Recursos Hidricos' },
  { id:'infraestrutura', label:'Infraestrutura' },
  { id:'agropecuaria', label:'Agropecuaria' },
  { id:'ambiental', label:'Ambiental' },
  { id:'tabela-manancial', label:'Tabela por Manancial' }
];

// ============ FORMATTERS ============
const fmt = v => typeof v === 'number' ? v.toLocaleString('pt-BR') : v;
const fmtDec = (v, d) => typeof v === 'number' ? v.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d }) : v;
function sumObj(obj) { return Object.values(obj || {}).reduce((s, v) => s + (typeof v === 'number' ? v : 0), 0); }
function mergeObjs(objs) {
  const r = {};
  objs.forEach(o => { for (const [k, v] of Object.entries(o || {})) { r[k] = (r[k] || 0) + (typeof v === 'number' ? v : 0); } });
  return r;
}
function objToSorted(obj) {
  return Object.entries(obj || {}).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
}

// ============ DATA LOADER ============
async function loadData() {
  const [bacias, summary] = await Promise.all([
    fetch('data/baciasselecionadas.geojson').then(r => r.json()),
    fetch('data/bi_summary.json').then(r => r.json())
  ]);
  return { bacias, summary };
}

// ============ D3 CHART COMPONENTS ============
function D3HBar({ data, fill, height, colorMap }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const margin = { top: 8, right: 50, bottom: 20, left: 140 };
    const w = (el.clientWidth || 460);
    const barH = 22;
    const totalH = height || Math.max(120, data.length * (barH + 4) + margin.top + margin.bottom);
    const innerW = w - margin.left - margin.right;
    const innerH = totalH - margin.top - margin.bottom;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', totalH);
    const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    const x = d3.scaleLinear().domain([0, d3.max(data, d => d.value) || 1]).range([0, innerW]);
    const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, innerH]).padding(0.15);

    g.selectAll('rect').data(data).join('rect')
      .attr('y', d => y(d.name)).attr('width', d => x(d.value))
      .attr('height', y.bandwidth())
      .attr('fill', d => (colorMap && colorMap[d.name]) || fill || '#1d4ed8')
      .attr('rx', 3);

    g.selectAll('.label').data(data).join('text').attr('class', 'label')
      .attr('x', d => x(d.value) + 4).attr('y', d => y(d.name) + y.bandwidth() / 2)
      .attr('dy', '0.35em').text(d => typeof d.value === 'number' && d.value % 1 !== 0 ? fmtDec(d.value, 1) : fmt(d.value))
      .attr('font-size', '11px').attr('fill', '#374151');

    g.append('g').call(d3.axisLeft(y).tickSize(0)).select('.domain').remove();
    g.selectAll('.tick text').attr('font-size', '11px');
    g.append('g').attr('transform', 'translate(0,' + innerH + ')').call(d3.axisBottom(x).ticks(5))
      .selectAll('text').attr('font-size', '10px');
  }, [data, fill, height, colorMap]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '120px' }}></div>`;
}

function D3Donut({ data, showLegend }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const w = Math.min(el.clientWidth || 300, 340);
    const legendH = (showLegend !== false) ? Math.ceil(data.length / 2) * 20 + 10 : 0;
    const chartH = 220;
    const hh = chartH + legendH;
    const radius = Math.min(w, chartH) / 2 - 10;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', hh);
    const g = svg.append('g').attr('transform', 'translate(' + (w / 2) + ',' + (chartH / 2) + ')');

    const pie = d3.pie().value(d => d.value).sort(null);
    const arc = d3.arc().innerRadius(radius * 0.55).outerRadius(radius);

    g.selectAll('path').data(pie(data)).join('path')
      .attr('d', arc).attr('fill', (d, i) => d.data.color || COLORS[i % COLORS.length])
      .attr('stroke', '#fff').attr('stroke-width', 2);

    g.selectAll('.lbl').data(pie(data)).join('text').attr('class', 'lbl')
      .attr('transform', d => {
        const c = arc.centroid(d);
        return 'translate(' + c + ')';
      })
      .attr('text-anchor', 'middle').attr('font-size', '10px').attr('fill', '#fff').attr('font-weight', '600')
      .text(d => (d.endAngle - d.startAngle) > 0.25 ? (typeof d.data.value === 'number' && d.data.value % 1 !== 0 ? fmtDec(d.data.value, 1) : fmt(d.data.value)) : '');

    if (showLegend !== false) {
      const lg = svg.append('g').attr('transform', 'translate(8,' + (chartH + 4) + ')');
      const colW = w / 2 - 8;
      data.forEach((d, i) => {
        const col = i % 2;
        const row = Math.floor(i / 2);
        const grp = lg.append('g').attr('transform', 'translate(' + (col * colW) + ',' + (row * 18) + ')');
        grp.append('rect').attr('width', 10).attr('height', 10).attr('rx', 2)
          .attr('fill', d.color || COLORS[i % COLORS.length]);
        const label = d.name.length > 22 ? d.name.slice(0, 20) + '..' : d.name;
        grp.append('text').attr('x', 14).attr('y', 9).text(label)
          .attr('font-size', '10px').attr('fill', '#374151');
      });
    }
  }, [data, showLegend]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '220px' }}></div>`;
}

function D3StackedBar({ data, keys, colors }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !data || data.length === 0 || !keys || keys.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const margin = { top: 8, right: 30, bottom: 30, left: 140 };
    const w = el.clientWidth || 460;
    const barH = 24;
    const legendH = Math.ceil(keys.length / 3) * 18 + 10;
    const totalH = data.length * (barH + 4) + margin.top + margin.bottom + legendH;
    const innerW = w - margin.left - margin.right;
    const innerH = totalH - margin.top - margin.bottom - legendH;

    const svg = d3.select(el).append('svg').attr('width', w).attr('height', totalH);
    const g = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + margin.top + ')');

    const maxVal = d3.max(data, d => keys.reduce((s, k) => s + (d[k] || 0), 0)) || 1;
    const x = d3.scaleLinear().domain([0, maxVal]).range([0, innerW]);
    const y = d3.scaleBand().domain(data.map(d => d.name)).range([0, innerH]).padding(0.15);
    const color = d3.scaleOrdinal().domain(keys).range(keys.map(k => colors[k] || '#94a3b8'));

    const stack = d3.stack().keys(keys)(data);
    g.selectAll('g.layer').data(stack).join('g').attr('class', 'layer')
      .attr('fill', d => color(d.key))
      .selectAll('rect').data(d => d).join('rect')
      .attr('y', d => y(d.data.name)).attr('x', d => x(d[0]))
      .attr('width', d => Math.max(0, x(d[1]) - x(d[0]))).attr('height', y.bandwidth()).attr('rx', 2);

    g.append('g').call(d3.axisLeft(y).tickSize(0)).select('.domain').remove();
    g.selectAll('.tick text').attr('font-size', '10px');

    const lg = svg.append('g').attr('transform', 'translate(' + margin.left + ',' + (innerH + margin.top + 20) + ')');
    const colW = Math.floor(innerW / 3);
    keys.forEach((k, i) => {
      const col = i % 3;
      const row = Math.floor(i / 3);
      const grp = lg.append('g').attr('transform', 'translate(' + (col * colW) + ',' + (row * 18) + ')');
      grp.append('rect').attr('width', 10).attr('height', 10).attr('rx', 2).attr('fill', color(k));
      const label = k.length > 18 ? k.slice(0, 16) + '..' : k;
      grp.append('text').attr('x', 14).attr('y', 9).text(label).attr('font-size', '10px').attr('fill', '#374151');
    });
  }, [data, keys, colors]);
  return html`<div ref=${ref} style=${{ width: '100%', minHeight: '120px' }}></div>`;
}

function MiniMap({ features, points, colorFn }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || !features || features.length === 0) return;
    const el = ref.current; el.innerHTML = '';
    const w = el.clientWidth || 500;
    const hh = 320;
    const svg = d3.select(el).append('svg').attr('width', w).attr('height', hh);
    const geo = { type: 'FeatureCollection', features };
    const proj = d3.geoMercator().fitSize([w - 20, hh - 20], geo);
    const path = d3.geoPath().projection(proj);
    svg.selectAll('path').data(features).join('path')
      .attr('d', path)
      .attr('fill', d => colorFn ? colorFn(d) : '#93c5fd')
      .attr('stroke', '#1e40af').attr('stroke-width', 0.5).attr('opacity', 0.7);
    if (points && points.length > 0) {
      svg.selectAll('circle').data(points).join('circle')
        .attr('cx', d => { const p = proj(d.geometry.coordinates); return p ? p[0] : 0; })
        .attr('cy', d => { const p = proj(d.geometry.coordinates); return p ? p[1] : 0; })
        .attr('r', 4).attr('fill', '#dc2626').attr('stroke', '#fff').attr('stroke-width', 1);
    }
  }, [features, points, colorFn]);
  return html`<div ref=${ref} class="dashboard-minimap" style=${{ minHeight: '320px' }}></div>`;
}

// ============ REUSABLE COMPONENTS ============
function KPICard({ number, label }) {
  return html`<div class="ds-indicator-card">
    <span class="ds-indicator-number">${typeof number === 'number' ? fmt(number) : number}</span>
    <span class="ds-indicator-label">${label}</span>
  </div>`;
}

function SortableTable({ columns, data, pageSize }) {
  const ps = pageSize || 15;
  const [search, setSearch] = useState('');
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [page, setPage] = useState(0);

  const filtered = useMemo(() => {
    if (!search) return data;
    const q = search.toLowerCase();
    return data.filter(row => columns.some(c => String(row[c.key] || '').toLowerCase().includes(q)));
  }, [data, search, columns]);

  const sorted = useMemo(() => {
    if (!sortCol) return filtered;
    return [...filtered].sort((a, b) => {
      const va = a[sortCol] ?? '';
      const vb = b[sortCol] ?? '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * sortDir;
      return String(va).localeCompare(String(vb), 'pt') * sortDir;
    });
  }, [filtered, sortCol, sortDir]);

  const totalPages = Math.ceil(sorted.length / ps);
  const paged = sorted.slice(page * ps, (page + 1) * ps);
  useEffect(() => { setPage(0); }, [search, data]);

  const handleSort = (key) => {
    if (sortCol === key) setSortDir(d => d * -1);
    else { setSortCol(key); setSortDir(1); }
  };

  return html`
    <input class="dashboard-search" placeholder="Buscar..." value=${search}
      onInput=${e => setSearch(e.target.value)} />
    <div style=${{ overflowX: 'auto' }}>
      <table class="dashboard-table">
        <thead><tr>
          ${columns.map(c => html`<th key=${c.key} onClick=${() => handleSort(c.key)}>
            ${c.label} ${sortCol === c.key ? (sortDir === 1 ? ' ▲' : ' ▼') : ''}
          </th>`)}
        </tr></thead>
        <tbody>
          ${paged.map((row, i) => html`<tr key=${i}>
            ${columns.map(c => html`<td key=${c.key}>${row[c.key] ?? '--'}</td>`)}
          </tr>`)}
        </tbody>
      </table>
    </div>
    ${totalPages > 1 && html`<div class="dashboard-pagination">
      <button disabled=${page === 0} onClick=${() => setPage(p => p - 1)}>Anterior</button>
      <span>${page + 1} de ${totalPages} (${sorted.length} registros)</span>
      <button disabled=${page >= totalPages - 1} onClick=${() => setPage(p => p + 1)}>Proximo</button>
    </div>`}`;
}

// 2. Visao Geral
function PageVisaoGeral({ mananciais, baciasData, summary }) {
  const t = summary.totals;
  const classeData = useMemo(() => {
    const counts = {};
    mananciais.forEach(m => { const c = m.Classe; counts[c] = (counts[c] || 0) + m.num_ottobacias; });
    return Object.entries(counts).map(([name, value]) => ({ name, value, color: CLASS_COLORS[name] || '#94a3b8' }));
  }, [mananciais]);
  const totalNasc = useMemo(() => mananciais.reduce((s, m) => s + m.nascentes, 0), [mananciais]);
  const totalConst = useMemo(() => mananciais.reduce((s, m) => s + m.construcoes.count, 0), [mananciais]);
  const totalCaf = useMemo(() => mananciais.reduce((s, m) => s + m.caf.count, 0), [mananciais]);
  const totalEstKm = useMemo(() => mananciais.reduce((s, m) => s + m.estradas_km, 0), [mananciais]);
  const totalHidKm = useMemo(() => mananciais.reduce((s, m) => s + m.hidrografia_km, 0), [mananciais]);
  const totalOttos = useMemo(() => mananciais.reduce((s, m) => s + m.num_ottobacias, 0), [mananciais]);
  const numBacias = useMemo(() => new Set(mananciais.map(m => m.Nome_bacia)).size, [mananciais]);
  const numMun = useMemo(() => new Set(mananciais.map(m => m.NomeMunicipio)).size, [mananciais]);
  const numReg = useMemo(() => new Set(mananciais.map(m => m.Regional_IDR)).size, [mananciais]);
  const colorFn = useCallback(d => CLASS_COLORS[d.properties.Classe] || '#94a3b8', []);
  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${mananciais.length} label="Mananciais" />
      <${KPICard} number=${totalOttos} label="Ottobacias" />
      <${KPICard} number=${numBacias} label="Bacias" />
      <${KPICard} number=${numMun} label="Municipios" />
      <${KPICard} number=${numReg} label="Regionais" />
      <${KPICard} number=${t.urts} label="URTs" />
      <${KPICard} number=${totalNasc} label="Nascentes" />
      <${KPICard} number=${totalConst} label="Construcoes" />
      <${KPICard} number=${totalCaf} label="CAFs" />
      <${KPICard} number=${fmtDec(totalEstKm, 1)} label="Estradas (km)" />
      <${KPICard} number=${fmtDec(totalHidKm, 1)} label="Hidrografia (km)" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Mapa das Ottobacias por Classe</h3>
        <${MiniMap} features=${baciasData} colorFn=${colorFn} />
      </div>
      <div class="dashboard-card">
        <h3>Distribuicao por Classe</h3>
        <${D3Donut} data=${classeData} />
      </div>
    </div>`;
}

// 3. Relevo
function PageRelevo({ mananciais, summary }) {
  const palAlt = summary.paletas.altimetria;
  const palDec = summary.paletas.declividade;
  const decLabels = summary.paletas.declividade_labels || {};

  const altClasses = useMemo(() => {
    const merged = mergeObjs(mananciais.map(m => m.altimetria));
    return Object.keys(merged).filter(k => merged[k] > 0);
  }, [mananciais]);
  const decClasses = useMemo(() => {
    const merged = mergeObjs(mananciais.map(m => m.declividade));
    return Object.keys(merged).filter(k => merged[k] > 0);
  }, [mananciais]);

  const altDonut = useMemo(() => {
    const merged = mergeObjs(mananciais.map(m => m.altimetria));
    return objToSorted(merged).map(d => ({ ...d, color: palAlt[d.name] || '#6b7280', value: Math.round(d.value) }));
  }, [mananciais]);
  const decDonut = useMemo(() => {
    const merged = mergeObjs(mananciais.map(m => m.declividade));
    return objToSorted(merged).map(d => ({ ...d, name: decLabels[d.name] || d.name, color: palDec[d.name] || '#6b7280', value: Math.round(d.value) }));
  }, [mananciais]);

  const altStacked = useMemo(() => {
    const keys = summary.classes_altimetria.filter(k => altClasses.includes(k));
    const data = mananciais.filter(m => Object.keys(m.altimetria).length > 0)
      .map(m => ({ name: m.Manancial, ...m.altimetria }))
      .sort((a, b) => { const ta = keys.reduce((s, k) => s + (a[k] || 0), 0); const tb = keys.reduce((s, k) => s + (b[k] || 0), 0); return tb - ta; })
      .slice(0, 15);
    return { data, keys };
  }, [mananciais, altClasses]);
  const decStacked = useMemo(() => {
    const keys = summary.classes_declividade.filter(k => decClasses.includes(k));
    const data = mananciais.filter(m => Object.keys(m.declividade).length > 0)
      .map(m => ({ name: m.Manancial, ...m.declividade }))
      .sort((a, b) => { const ta = keys.reduce((s, k) => s + (a[k] || 0), 0); const tb = keys.reduce((s, k) => s + (b[k] || 0), 0); return tb - ta; })
      .slice(0, 15);
    return { data, keys };
  }, [mananciais, decClasses]);

  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${altClasses.length} label="Classes altimetria" />
      <${KPICard} number=${decClasses.length} label="Classes declividade" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Altimetria por Manancial (ha) — Top 15</h3>
        <${D3StackedBar} data=${altStacked.data} keys=${altStacked.keys} colors=${palAlt} />
      </div>
      <div class="dashboard-card">
        <h3>Proporcao por Classe de Altimetria</h3>

// 4. Uso do Solo
function PageUsoSolo({ mananciais, summary }) {
  const pal = summary.paletas.uso_solo;
  const totalArea = useMemo(() => mananciais.reduce((s, m) => s + sumObj(m.uso_solo), 0), [mananciais]);
  const merged = useMemo(() => mergeObjs(mananciais.map(m => m.uso_solo)), [mananciais]);
  const predominant = useMemo(() => { const e = objToSorted(merged); return e[0] ? e[0].name : '--'; }, [merged]);
  const donut = useMemo(() => objToSorted(merged).map(d => ({ ...d, color: pal[d.name] || '#94a3b8', value: Math.round(d.value) })), [merged]);
  const keys = useMemo(() => summary.classes_uso_solo.filter(k => merged[k] > 0), [merged]);

  const stacked = useMemo(() => {
    const data = mananciais.filter(m => Object.keys(m.uso_solo).length > 0)
      .map(m => ({ name: m.Manancial, ...m.uso_solo }))
      .sort((a, b) => { const ta = keys.reduce((s, k) => s + (a[k] || 0), 0); const tb = keys.reduce((s, k) => s + (b[k] || 0), 0); return tb - ta; })
      .slice(0, 15);
    return data;
  }, [mananciais, keys]);

  const topFloresta = useMemo(() =>
    mananciais.filter(m => m.uso_solo['Floresta Nativa'] > 0)
      .map(m => ({ name: m.Manancial, value: Math.round(m.uso_solo['Floresta Nativa']) }))
      .sort((a, b) => b.value - a.value).slice(0, 10)
  , [mananciais]);

  return html`
    <div class="dashboard-kpis">
      <${KPICard} number=${fmtDec(totalArea, 0)} label="Area total (ha)" />
      <${KPICard} number=${predominant} label="Classe predominante" />
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Uso do Solo por Manancial (ha) — Top 15</h3>
        <${D3StackedBar} data=${stacked} keys=${keys} colors=${pal} />
      </div>
      <div class="dashboard-card">
        <h3>Proporcao por Classe</h3>
        <${D3Donut} data=${donut} />
      </div>
    </div>
    <div class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Top 10 — Floresta Nativa (ha)</h3>
        <${D3HBar} data=${topFloresta} fill="#1a7f3b" />
      </div>
    </div>`;
}

// ============ FILTER BAR ============
function FilterBar({ mananciais, allMananciais, filters, setFilters }) {
  const allRegionais = useMemo(() =>
    [...new Set(allMananciais.map(m => m.Regional_IDR))].sort((a, b) => a.localeCompare(b, 'pt'))
  , [allMananciais]);
  const allMunicipios = useMemo(() => {
    const src = filters.regional ? allMananciais.filter(m => m.Regional_IDR === filters.regional) : allMananciais;
    return [...new Set(src.map(m => m.NomeMunicipio))].sort((a, b) => a.localeCompare(b, 'pt'));
  }, [allMananciais, filters.regional]);
  const allBacias = useMemo(() =>
    [...new Set(allMananciais.map(m => m.Nome_bacia))].sort((a, b) => a.localeCompare(b, 'pt'))
  , [allMananciais]);
  const allManancialNames = useMemo(() => {
    let src = allMananciais;
    if (filters.regional) src = src.filter(m => m.Regional_IDR === filters.regional);
    if (filters.municipio) src = src.filter(m => m.NomeMunicipio === filters.municipio);
    if (filters.bacia) src = src.filter(m => m.Nome_bacia === filters.bacia);
    return [...new Set(src.map(m => m.Manancial))].sort((a, b) => a.localeCompare(b, 'pt'));
  }, [allMananciais, filters.regional, filters.municipio, filters.bacia]);
  const chips = [];
  if (filters.regional) chips.push({ label: 'Regional: ' + filters.regional, clear: () => setFilters(p => ({ ...p, regional: '', municipio: '', manancial: '' })) });
  if (filters.municipio) chips.push({ label: 'Municipio: ' + filters.municipio, clear: () => setFilters(p => ({ ...p, municipio: '', manancial: '' })) });
  if (filters.bacia) chips.push({ label: 'Bacia: ' + filters.bacia, clear: () => setFilters(p => ({ ...p, bacia: '', manancial: '' })) });
  if (filters.manancial) chips.push({ label: 'Manancial: ' + filters.manancial, clear: () => setFilters(p => ({ ...p, manancial: '' })) });
  return html`
    <div class="dashboard-filters">
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Regional IDR</label>
        <select class="dashboard-filter-select" value=${filters.regional}
          onChange=${e => setFilters(p => ({ ...p, regional: e.target.value, municipio: '', manancial: '' }))}>
          <option value="">Todas</option>
          ${allRegionais.map(r => html`<option key=${r} value=${r}>${r}</option>`)}
        </select>
      </div>
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Municipio</label>
        <select class="dashboard-filter-select" value=${filters.municipio}
          onChange=${e => setFilters(p => ({ ...p, municipio: e.target.value, manancial: '' }))}>
          <option value="">Todos</option>
          ${allMunicipios.map(m => html`<option key=${m} value=${m}>${m}</option>`)}
        </select>
      </div>
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Bacia</label>
        <select class="dashboard-filter-select" value=${filters.bacia}
          onChange=${e => setFilters(p => ({ ...p, bacia: e.target.value, manancial: '' }))}>
          <option value="">Todas</option>
          ${allBacias.map(b => html`<option key=${b} value=${b}>${b}</option>`)}
        </select>
      </div>
      <div class="dashboard-filter-group">
        <label class="dashboard-filter-label">Manancial</label>
        <select class="dashboard-filter-select" value=${filters.manancial}
          onChange=${e => setFilters(p => ({ ...p, manancial: e.target.value }))}>
          <option value="">Todos</option>
          ${allManancialNames.map(m => html`<option key=${m} value=${m}>${m}</option>`)}
        </select>
      </div>
    </div>
    ${chips.length > 0 && html`<div class="dashboard-active-filters">
      ${chips.map((c, i) => html`<span key=${i} class="dashboard-filter-chip">
        ${c.label} <button onClick=${c.clear}>x</button>
      </span>`)}
    </div>`}`;
}

// ============ MAIN DASHBOARD ============
function Dashboard({ rawBacias, summary }) {
  const [activeTab, setActiveTab] = useState(() => {
    const hh = window.location.hash.replace('#', '');
    return TABS.find(t => t.id === hh) ? hh : 'capa';
  });
  const [filters, setFilters] = useState({ regional: '', municipio: '', bacia: '', manancial: '' });
  const [printing, setPrinting] = useState(false);

  useEffect(() => {
    const handler = () => {
      const hh = window.location.hash.replace('#', '');
      if (TABS.find(t => t.id === hh)) setActiveTab(hh);
    };
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);

  const switchTab = (id) => { setActiveTab(id); window.location.hash = id; };

  // Filter mananciais from summary
  const allMananciais = summary.mananciais;
  const filteredMananciais = useMemo(() => {
    let list = allMananciais;
    if (filters.regional) list = list.filter(m => m.Regional_IDR === filters.regional);
    if (filters.municipio) list = list.filter(m => m.NomeMunicipio === filters.municipio);
    if (filters.bacia) list = list.filter(m => m.Nome_bacia === filters.bacia);
    if (filters.manancial) list = list.filter(m => m.Manancial === filters.manancial);
    return list;
  }, [allMananciais, filters]);

  // Filter bacias features to match filtered mananciais
  const filteredCodMans = useMemo(() => new Set(filteredMananciais.map(m => String(m.Cod_man))), [filteredMananciais]);
  const baciasFiltered = useMemo(() =>
    rawBacias.features.filter(f => filteredCodMans.has(String(f.properties.Cod_man)))
  , [rawBacias, filteredCodMans]);

  const handlePrintAll = () => { setPrinting(true); setTimeout(() => { window.print(); setPrinting(false); }, 300); };

  return html`<div class="dashboard-container">
    <div class="dashboard-tabs">
      ${TABS.map(t => html`<button key=${t.id}
        class=${'dashboard-tab' + (activeTab === t.id ? ' active' : '')}
        onClick=${() => switchTab(t.id)}>${t.label}</button>`)}
    </div>
    ${activeTab !== 'capa' && html`<${FilterBar} mananciais=${filteredMananciais} allMananciais=${allMananciais} filters=${filters} setFilters=${setFilters} />`}
    <div class="dashboard-print-controls">
      <button onClick=${() => window.print()}>Imprimir pagina atual</button>
      <button onClick=${handlePrintAll}>Imprimir todas</button>
    </div>
    ${TABS.map(t => {
      const isActive = printing || activeTab === t.id;
      const cls = 'dashboard-page' + (isActive ? ' active' : '') + (printing ? ' print-visible' : '');
      let content;
      switch(t.id) {
        case 'capa': content = html`<${PageCapa} />`; break;
        case 'visao-geral': content = html`<${PageVisaoGeral} mananciais=${filteredMananciais} baciasData=${baciasFiltered} summary=${summary} />`; break;
        case 'relevo': content = html`<${PageRelevo} mananciais=${filteredMananciais} summary=${summary} />`; break;
        case 'uso-solo': content = html`<${PageUsoSolo} mananciais=${filteredMananciais} summary=${summary} />`; break;
        case 'solos': content = html`<${PageSolos} mananciais=${filteredMananciais} summary=${summary} />`; break;
        case 'recursos-hidricos': content = html`<${PageRecursosHidricos} mananciais=${filteredMananciais} />`; break;
        case 'infraestrutura': content = html`<${PageInfraestrutura} mananciais=${filteredMananciais} />`; break;
        case 'agropecuaria': content = html`<${PageAgropecuaria} mananciais=${filteredMananciais} />`; break;
        case 'ambiental': content = html`<${PageAmbiental} mananciais=${filteredMananciais} summary=${summary} />`; break;
        case 'tabela-manancial': content = html`<${PageTabelaManancial} mananciais=${filteredMananciais} />`; break;
      }
      return html`<div key=${t.id} class=${cls}>
        <div class="print-header">
          <div class="header-logos">
            <img src="data/aguaseguralogo2.png" alt="Agua Segura" style=${{ height: '28px' }} />
            <img src="data/logo_sanepar.jpg" alt="Sanepar" style=${{ height: '24px' }} />
          </div>
          <span><strong>${t.label}</strong> — Programa Agua Segura — ${new Date().toLocaleDateString('pt-BR')}</span>
        </div>
        ${content}
        <div class="print-footer">Departamento de Sustentabilidade · IDR-Parana · 2026</div>
      </div>`;
    })}
  </div>`;
}

// ============ APP ============
function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  useEffect(() => { loadData().then(setData).catch(e => setError(e.message)); }, []);
  if (error) return html`<div class="dashboard-container"><div class="dashboard-card"><h3>Erro ao carregar dados</h3><p>${error}</p></div></div>`;
  if (!data) return html`<div class="dashboard-container" style=${{ textAlign: 'center', padding: '4rem 2rem' }}>
    <p style=${{ fontSize: '1.1rem', color: '#6b7280' }}>Carregando dados do Programa Agua Segura...</p>
  </div>`;
  return html`<${Dashboard} rawBacias=${data.bacias} summary=${data.summary} />`;
}

createRoot(document.getElementById('dashboard-root')).render(html`<${App} />`);
