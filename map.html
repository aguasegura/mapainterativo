    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script>
      (function ensureBaseHref() {
        try {
          const current = new URL(document.currentScript?.src || window.location.href, window.location.href);
          const base = new URL('./', current);
          let baseEl = document.querySelector('base[data-auto-base]');
          if (!baseEl) {
            baseEl = document.createElement('base');
            baseEl.setAttribute('data-auto-base', 'true');
            if (document.head.firstChild) {
              document.head.insertBefore(baseEl, document.head.firstChild);
            } else {
              document.head.appendChild(baseEl);
            }
          }
          baseEl.href = base.href;
          window.__APP_BASE_URL__ = base.href;
        } catch (error) {
          console.error('Não foi possível definir a base dos assets.', error);
        }
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="header-logos">
        <img src="data/aguaseguralogo1.png" alt="Programa Água Segura" class="logo-small" />
        <img src="data/logo_sanepar.jpg" alt="Sanepar" class="logo-small" />
        <img src="data/Logo_IAT_PR.png" alt="IAT-Paraná" class="logo-small" />
        <img src="data/adapar.png" alt="ADAPAR" class="logo-small" />
        <img src="data/logo_IDR-SEAB.png" alt="IDR-SEAB" class="logo-small" />
      </div>
      <span id="regionPill" class="region-pill" aria-live="polite"></span>
      <a class="btn link-btn" href="selecaoregional.html">Trocar regional</a>
      <a class="btn link-btn" href="dashboard.html">Painel BI</a>
      <a class="btn link-btn" href="index.html" style="--arrow:'⌂'">Início</a>
      <button id="fitAll" class="btn" type="button" aria-label="Ajustar visão para mostrar todas as microbacias">Ajustar visão</button>
      <button id="toggle3D" class="btn btn-3d" type="button">
        <span class="toggle-icon">🌍</span> Visão 3D
      </button>
      <div class="slider-row" role="group" aria-label="Controle de opacidade das camadas">
        <label for="opacity" class="muted">Opacidade</label>
        <input id="opacity" type="range" min="20" max="100" value="70" aria-label="Opacidade das camadas do mapa" aria-valuemin="20" aria-valuemax="100" aria-valuenow="70" />
        <span id="opacityVal" class="muted" aria-live="polite">70%</span>
      </div>
      <div class="slider-row" id="terrainExaggerationControl" style="display: none;">
        <span class="muted">Exagero do Relevo</span>
        <input id="terrainExaggeration" type="range" min="1" max="3" step="0.1" value="1" />
        <span id="terrainExaggerationVal" class="muted">1.0x</span>
      </div>
      <span class="version">IDR-Paraná · 2026</span>
    </header>

    <div id="map"></div>
    <div id="cesiumContainer" style="display: none;"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
