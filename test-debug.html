<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teste do Mapa - Debug</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #map {
      height: 100vh;
      width: 100%;
    }
    .debug-info {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      padding: 10px;
      z-index: 1000;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      max-width: 300px;
      max-height: 400px;
      overflow-y: auto;
    }
    .debug-info h3 {
      margin-top: 0;
      font-size: 14px;
    }
    .debug-info p {
      margin: 5px 0;
      font-size: 12px;
      font-family: monospace;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
    .loading {
      color: orange;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="debug-info">
    <h3>Debug Info</h3>
    <div id="debug-log"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  
  <script>
    const debugLog = document.getElementById('debug-log');
    
    function addDebugMessage(message, type = 'info') {
      const p = document.createElement('p');
      p.className = type;
      p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      debugLog.appendChild(p);
      debugLog.scrollTop = debugLog.scrollHeight;
    }
    
    // Teste básico do mapa
    addDebugMessage('Iniciando mapa...', 'loading');
    
    try {
      // Criar mapa básico
      const map = L.map('map', {
        center: [-25.42, -49.27], // Curitiba
        zoom: 10,
        preferCanvas: true
      });
      
      addDebugMessage('Mapa criado com sucesso', 'success');
      
      // Adicionar camada base
      const baseLayer = L.tileLayer('https://cartodb-basemaps-a.global.ssl.fastly.net/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap, &copy; CARTO'
      }).addTo(map);
      
      addDebugMessage('Camada base adicionada', 'success');
      
      // Testar carregamento de um arquivo GeoJSON
      addDebugMessage('Tentando carregar baciasselecionadas.geojson...', 'loading');
      
      fetch('data/baciasselecionadas.geojson')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          addDebugMessage(`Arquivo carregado (status: ${response.status})`, 'success');
          return response.json();
        })
        .then(data => {
          addDebugMessage(`GeoJSON parseado: ${data.features ? data.features.length : 0} features`, 'success');
          
          // Adicionar ao mapa
          const geoJsonLayer = L.geoJSON(data, {
            style: {
              color: '#1d4ed8',
              weight: 2,
              fillColor: '#bfdbfe',
              fillOpacity: 0.3
            },
            onEachFeature: (feature, layer) => {
              if (feature.properties) {
                const props = Object.entries(feature.properties)
                  .map(([key, value]) => `<b>${key}</b>: ${value}`)
                  .join('<br>');
                layer.bindPopup(props);
              }
            }
          }).addTo(map);
          
          // Ajustar zoom para a camada
          map.fitBounds(geoJsonLayer.getBounds());
          addDebugMessage('Camada GeoJSON adicionada ao mapa', 'success');
          
          // Verificar propriedades
          if (data.features && data.features.length > 0) {
            const firstFeature = data.features[0];
            if (firstFeature.properties) {
              const props = Object.keys(firstFeature.properties).join(', ');
              addDebugMessage(`Propriedades encontradas: ${props}`, 'info');
            }
          }
        })
        .catch(error => {
          addDebugMessage(`Erro ao carregar GeoJSON: ${error.message}`, 'error');
          console.error('Erro completo:', error);
        });
      
      // Testar carregamento de arquivo .gz
      addDebugMessage('Tentando carregar arquivo .gz...', 'loading');
      
      fetch('data/car.geojson_part-001.gz')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          addDebugMessage(`Arquivo .gz carregado (status: ${response.status})`, 'success');
          return response.arrayBuffer();
        })
        .then(buffer => {
          const unzipped = pako.ungzip(new Uint8Array(buffer), { to: 'string' });
          const data = JSON.parse(unzipped);
          addDebugMessage(`Arquivo .gz descompactado: ${data.features ? data.features.length : 0} features`, 'success');
        })
        .catch(error => {
          addDebugMessage(`Erro com arquivo .gz: ${error.message}`, 'error');
        });
      
    } catch (error) {
      addDebugMessage(`Erro crítico: ${error.message}`, 'error');
      console.error('Erro completo:', error);
    }
    
    // Verificar bibliotecas carregadas
    addDebugMessage(`Leaflet: ${typeof L !== 'undefined' ? 'OK' : 'ERRO'}`, typeof L !== 'undefined' ? 'success' : 'error');
    addDebugMessage(`Pako: ${typeof pako !== 'undefined' ? 'OK' : 'ERRO'}`, typeof pako !== 'undefined' ? 'success' : 'error');
    addDebugMessage(`Turf: ${typeof turf !== 'undefined' ? 'OK' : 'ERRO'}`, typeof turf !== 'undefined' ? 'success' : 'error');
  </script>
</body>
</html>
